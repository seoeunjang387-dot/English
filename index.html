<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>English Quest</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jua&family=Gowun+Dodum&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#2b2145; --paper:#faf6ee; --paper2:#f1e9d8;
  --gold:#e0a72e; --gold-dark:#b9821a;
  --violet:#5b3e9e; --violet-dark:#3c2969;
  --leaf:#4f9d5e; --rose:#d9556b;
  --sky:#7ec8e3;
  --shadow: 0 6px 0 rgba(43,33,69,.25);
  box-sizing:border-box;
  padding-top: env(safe-area-inset-top,0px);
  padding-bottom: env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;}
html{scroll-padding-top:env(safe-area-inset-top,0px);}
body{
  margin:0; min-height:100%; font-family:'Gowun Dodum',sans-serif;
  background: radial-gradient(circle at 20% 0%, #6a4bb0 0%, #3c2969 45%, #241a42 100%);
  color:var(--ink);
}
.title-font{font-family:'Jua',sans-serif;}
#app{max-width:520px;margin:0 auto;min-height:100vh;position:relative;display:flex;flex-direction:column;}

/* ---- top bar ---- */
#topbar{
  padding:14px 16px 10px; color:#fff;
}
#topbar .row1{display:flex;justify-content:space-between;align-items:baseline;}
#topbar .brand{font-family:'Jua',sans-serif;font-size:20px;letter-spacing:1px;}
#topbar .stage{font-size:13px;opacity:.85;margin-top:2px;}
#statgrid{
  margin-top:10px; display:flex; gap:8px; flex-wrap:wrap;
}
.stat-pill{
  background:rgba(255,255,255,.14); border:1px solid rgba(255,255,255,.25);
  border-radius:999px; padding:5px 12px; font-size:13px; display:flex; align-items:center; gap:5px;
}
#xpbar-wrap{margin-top:8px;background:rgba(255,255,255,.15);border-radius:999px;height:10px;overflow:hidden;}
#xpbar{height:100%;background:linear-gradient(90deg,var(--gold),#ffd76a);width:0%;transition:width .4s;}
#limitbar-wrap{margin-top:6px;background:rgba(255,255,255,.15);border-radius:999px;height:6px;overflow:hidden;}
#limitbar{height:100%;background:var(--sky);width:0%;transition:width .4s;}
#limittext{font-size:11px;opacity:.8;margin-top:3px;}

/* ---- main card ---- */
#main{
  flex:1; background:var(--paper); border-radius:26px 26px 0 0; padding:22px 18px 100px;
  box-shadow: 0 -8px 24px rgba(0,0,0,.25);
}
h2.section-title{font-family:'Jua',sans-serif;color:var(--violet-dark);margin:0 0 14px;font-size:20px;}

/* ---- start screen ---- */
.center-card{text-align:center;padding:20px 10px;}
.big-emoji{font-size:64px;line-height:1;}
input[type=text]{
  width:100%; padding:12px 14px; border-radius:14px; border:2px solid var(--paper2);
  font-family:'Gowun Dodum',sans-serif; font-size:16px; margin-top:10px; background:#fff;
}
.emoji-grid{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin:14px 0;}
.emoji-choice{
  font-size:30px; padding:10px 12px; border-radius:16px; background:var(--paper2); border:2px solid transparent; cursor:pointer;
}
.emoji-choice.selected{border-color:var(--gold-dark); background:#fff0cf;}

/* ---- buttons ---- */
.btn{
  font-family:'Gowun Dodum',sans-serif; font-size:15px; border:none; border-radius:16px;
  padding:14px 18px; cursor:pointer; width:100%; text-align:left; margin-bottom:10px;
  background:#fff; box-shadow: var(--shadow); border:2px solid var(--paper2);
  transition: transform .08s;
}
.btn:active{transform:translateY(3px); box-shadow:0 3px 0 rgba(43,33,69,.25);}
.btn.correct{background:#e3f6e6;border-color:var(--leaf);}
.btn.wrong{background:#fbe5e8;border-color:var(--rose);}
.btn.disabled{opacity:.55;pointer-events:none;}
.btn-primary{
  background:var(--gold); color:#3c2600; font-family:'Jua',sans-serif; box-shadow:0 6px 0 var(--gold-dark);
  text-align:center;
}
.btn-primary:active{box-shadow:0 3px 0 var(--gold-dark);}
.btn-ghost{background:transparent;box-shadow:none;border:2px solid var(--paper2);text-align:center;}

/* ---- question ---- */
#qmeta{font-size:13px;color:#7a6d99;margin-bottom:6px;}
#qtext{font-size:19px;font-weight:700;line-height:1.5;margin-bottom:18px;color:var(--ink);}
#feedback{
  border-radius:16px;padding:14px;margin:14px 0;font-size:14px;line-height:1.6;display:none;
}
#feedback.ok{background:#e3f6e6;color:#215b2c;display:block;}
#feedback.bad{background:#fbe5e8;color:#7c1f2d;display:block;}

/* ---- boss ---- */
.boss-hp-wrap{background:var(--paper2);border-radius:999px;height:18px;overflow:hidden;margin:10px 0 4px;}
.boss-hp{height:100%;background:linear-gradient(90deg,var(--rose),#ff8fa3);width:100%;transition:width .5s;}
.boss-emoji{font-size:56px;text-align:center;}

/* ---- notebook / achievements / status lists ---- */
.note-card{background:#fff;border:2px solid var(--paper2);border-radius:16px;padding:14px;margin-bottom:12px;}
.note-card h4{margin:0 0 6px;color:var(--violet-dark);font-family:'Jua',sans-serif;font-size:16px;}
.note-card p{margin:4px 0;font-size:14px;line-height:1.55;}
.badge-row{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0;}
.badge{background:var(--paper2);border-radius:14px;padding:10px;text-align:center;width:31%;font-size:12px;}
.badge.locked{opacity:.35;}
.badge .ic{font-size:24px;}
.stat-line{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px dashed var(--paper2);font-size:14px;}

/* ---- bottom action bar ---- */
#actionbar{
  position:fixed; left:0; right:0; bottom:0; max-width:520px; margin:0 auto;
  background:var(--paper); border-top:2px solid var(--paper2);
  padding:10px 16px calc(12px + env(safe-area-inset-bottom,0px));
  display:flex; gap:10px; align-items:center;
}
#actionbar button{flex:1;margin:0;}
.icon-btn{background:#fff;border:2px solid var(--paper2);border-radius:14px;padding:12px 8px;font-size:13px;text-align:center;}
.icon-btn.next{background:var(--gold);border-color:var(--gold-dark);font-family:'Jua',sans-serif;color:#3c2600;}
.icon-btn[disabled]{opacity:.4;pointer-events:none;}

.limit-alert{
  background:#fff3e0;border:2px solid var(--gold-dark);border-radius:14px;padding:12px;margin-bottom:14px;font-size:13px;color:#7a4c00;
}
.hidden{display:none !important;}
</style>
</head>
<body>
<div id="app">
  <div id="topbar">
    <div class="row1">
      <div class="brand">🦋 English Quest</div>
      <div id="hearts"></div>
    </div>
    <div class="stage" id="stageLabel">모험을 시작해 볼까?</div>
    <div id="statgrid"></div>
    <div id="xpbar-wrap"><div id="xpbar"></div></div>
    <div id="limitbar-wrap"><div id="limitbar"></div></div>
    <div id="limittext"></div>
  </div>
  <div id="main"></div>
  <div id="actionbar" class="hidden"></div>
</div>

<script>
/* ========================= 데이터 ========================= */
const STAGES = [
 {name:"Stage 1 · be동사 기초", qs:[
   {q:"I ___ a student.", opts:["am","is","are","be"], a:0, exp:"주어가 I일 때는 am을 써요."},
   {q:"She ___ happy.", opts:["am","is","are","be"], a:1, exp:"주어가 한 명(She)일 때는 is를 써요."},
   {q:"They ___ friends.", opts:["am","is","are","be"], a:2, exp:"주어가 여러 명(They)일 때는 are를 써요."},
   {q:"We ___ at school.", opts:["is","am","are","be"], a:2, exp:"We는 여러 명이니까 are를 써요."},
   {q:"He ___ my brother.", opts:["are","am","is","be"], a:2, exp:"He는 한 명이니까 is를 써요."},
   {q:"It ___ a cat.", opts:["am","are","is","be"], a:2, exp:"It은 한 개니까 is를 써요."}
 ]},
 {name:"Stage 2 · be동사 심화", qs:[
   {q:"I ___ not tired.", opts:["am","is","are","do"], a:0, exp:"am 뒤에 not을 붙이면 부정문이 돼요."},
   {q:"___ you ready?", opts:["Am","Is","Are","Do"], a:2, exp:"주어가 you일 때 의문문은 Are로 시작해요."},
   {q:"She ___ not at home.", opts:["am","is","are","does"], a:1, exp:"She는 is의 부정문이니 is not이에요."},
   {q:"___ they students?", opts:["Am","Is","Are","Do"], a:2, exp:"they는 복수라서 Are로 물어봐요."},
   {q:"It ___ not raining.", opts:["am","is","are","do"], a:1, exp:"It은 is의 부정문을 써요."},
   {q:"___ he a doctor?", opts:["Am","Is","Are","Does"], a:1, exp:"he는 단수라서 Is로 물어봐요."}
 ]},
 {name:"Stage 3 · 일반동사 기초", qs:[
   {q:"I ___ soccer every day.", opts:["play","plays","playing","am play"], a:0, exp:"주어가 I일 때는 동사원형(play)을 써요."},
   {q:"He ___ soccer every day.", opts:["play","plays","playing","is play"], a:1, exp:"주어가 He(3인칭 단수)일 땐 동사에 s를 붙여요."},
   {q:"They ___ to school.", opts:["walks","walk","walking","is walk"], a:1, exp:"they는 복수라서 s를 붙이지 않아요."},
   {q:"She ___ books.", opts:["read","reads","reading","is read"], a:1, exp:"She는 3인칭 단수라서 reads예요."},
   {q:"We ___ pizza.", opts:["like","likes","liking","is like"], a:0, exp:"we는 복수니까 동사원형을 써요."},
   {q:"My dog ___ fast.", opts:["run","runs","running","is run"], a:1, exp:"My dog은 한 마리(3인칭 단수)라서 runs예요."}
 ]},
 {name:"Stage 4 · 일반동사 부정문·의문문", qs:[
   {q:"I ___ not like milk.", opts:["do","does","am","is"], a:0, exp:"I는 do not(don't)으로 부정문을 만들어요."},
   {q:"He ___ not like milk.", opts:["do","does","am","is"], a:1, exp:"He는 does not(doesn't)을 써요."},
   {q:"___ you like pizza?", opts:["Do","Does","Am","Is"], a:0, exp:"you는 Do로 물어봐요."},
   {q:"___ she play tennis?", opts:["Do","Does","Am","Is"], a:1, exp:"she는 3인칭 단수라서 Does로 물어봐요."},
   {q:"They ___ not go home.", opts:["do","does","is","am"], a:0, exp:"they는 복수라서 do not이에요."},
   {q:"___ he live here?", opts:["Do","Does","Is","Am"], a:1, exp:"he는 3인칭 단수라서 Does로 물어봐요."}
 ]},
 {name:"Stage 5 · 종합 복습", qs:[
   {q:"My sister ___ a teacher.", opts:["am","is","are","do"], a:1, exp:"My sister는 한 명이라서 is예요."},
   {q:"___ they like dogs?", opts:["Do","Does","Is","Am"], a:0, exp:"they는 복수라서 Do로 물어봐요."},
   {q:"He ___ not a doctor.", opts:["is","are","do","am"], a:0, exp:"He는 is not이에요."},
   {q:"We ___ soccer on Sunday.", opts:["plays","play","is play","am play"], a:1, exp:"we는 복수니까 동사원형이에요."},
   {q:"She ___ not eat meat.", opts:["do","does","is","am"], a:1, exp:"She는 does not이에요."},
   {q:"___ you a student?", opts:["Am","Is","Are","Do"], a:2, exp:"you는 Are로 물어봐요."}
 ]}
];
const BOSSES = { 5: {name:"🐉 영어 드래곤", n:10} };

/* 5스테이지 이후 무한 문제용 재료 */
const POOL_SUBJ=[["I","am","do"],["You","are","do"],["He","is","does"],["She","is","does"],["We","are","do"],["They","are","do"],["It","is","does"]];
const POOL_VERB=[["play","plays"],["like","likes"],["read","reads"],["watch","watches"],["run","runs"],["study","studies"]];
const POOL_OBJ=["soccer","music","books","movies","English","math"];

const GRADES = ["초4","초5","초6","중1","중2","중3","고1","고2","고3","성인/기타"];
/* 학년별 기본 예상 시작 스테이지 (테스트 점수로 최종 보정됨) */
const GRADE_BASE_STAGE = {"초4":1,"초5":1,"초6":1,"중1":1,"중2":2,"중3":2,"고1":3,"고2":3,"고3":4,"성인/기타":2};

function buildLevelTest(){
  // 스테이지 1~5에서 난이도 순서대로 2문제씩 뽑아 10문제 구성
  const qs=[];
  STAGES.forEach(s=>{ qs.push(s.qs[0]); qs.push(s.qs[3]); });
  return qs;
}
function decideStartFromTest(correct, grade){
  // 정답 개수(0~10)를 기준으로 시작 스테이지/레벨 산출, 학년 기본값을 살짝 반영
  let stage, level;
  if(correct<=2){ stage=1; level=1; }
  else if(correct<=4){ stage=2; level=3; }
  else if(correct<=6){ stage=3; level=5; }
  else if(correct<=8){ stage=4; level=8; }
  else { stage=5; level=12; }
  const gradeBase = GRADE_BASE_STAGE[grade] || 1;
  stage = Math.max(stage, Math.min(gradeBase, stage+1)); // 학년이 높은데 점수가 낮으면 한 단계까지만 보정
  return {stage, level};
}

const ACHIEVEMENTS = [
 {id:"first_correct", name:"첫 번째 문제 정답", ic:"🏆", check:s=>s.totalCorrect>=1},
 {id:"xp100", name:"100 XP 달성", ic:"🏆", check:s=>s.totalXPEarned>=100},
 {id:"first_boss", name:"첫 번째 보스 클리어", ic:"🏆", check:s=>s.bossClears.length>=1},
 {id:"streak10", name:"10문제 연속 정답", ic:"🏆", check:s=>s.bestStreak>=10},
 {id:"lv10", name:"Lv.10 달성", ic:"🏆", check:s=>s.level>=10},
 {id:"first_evo", name:"첫 번째 캐릭터 진화", ic:"🏆", check:s=>s.evolutionStage>=1},
 {id:"review_done", name:"오답 복습 완료", ic:"🏆", check:s=>s.reviewCleared===true}
];

/* ========================= 상태 ========================= */
const SAVE_KEY = "englishQuest_save_v1";
let state = loadState();

function defaultState(){
  return {
    charEmoji:"", charName:"",
    level:1, xp:0, stage:1,
    heart:5,
    wrongBook:{}, // concept -> {count, examples:[{q,a,exp}]}
    achievements:[],
    bossClears:[],
    evolutionStage:0,
    totalAnswered:0, totalCorrect:0, totalWrong:0, totalXPEarned:0,
    streak:0, bestStreak:0,
    limitDate:"", limitUsed:0, limitTotal:40,
    inBoss:false, bossHP:100, bossIdx:0, bossCorrect:0, bossTotal:0, bossName:"",
    bossFailed:false,
    curQIdx:0, curStageQs:[], answered:false, lastPick:-1,
    fallbackLevel:0,
    reviewQueue:[], reviewCleared:false,
    recentResults:[], stageAskedIdx:[], stageTarget:6, mode:'stage',
    playerAge:"", playerGrade:"",
    testIdx:0, testCorrect:0, testQs:[], testDone:false,
    startStage:1, startLevel:1,
    onboardingDone:false,
    screen:"playerInfo"
  };
}
function loadState(){
  try{
    const raw = localStorage.getItem(SAVE_KEY);
    if(!raw) return defaultState();
    const s = Object.assign(defaultState(), JSON.parse(raw));
    if(s.charEmoji && !("onboardingDone" in JSON.parse(raw))){ s.onboardingDone = true; }
    checkLimitReset(s);
    return s;
  }catch(e){ return defaultState(); }
}
function save(){
  try{ localStorage.setItem(SAVE_KEY, JSON.stringify(state)); }catch(e){}
}
function checkLimitReset(s){
  const today = new Date().toISOString().slice(0,10);
  if(s.limitDate !== today){ s.limitDate = today; s.limitUsed = 0; }
}

/* ========================= 유틸 ========================= */
function xpNeeded(){ return 100; }
function heartsHTML(){
  let h="";
  for(let i=0;i<5;i++) h += i < state.heart ? "❤️" : "🖤";
  return h;
}
function evoLabel(){
  const stars = "⭐".repeat(state.evolutionStage);
  return state.evolutionStage>0 ? " "+stars : "";
}
function pct(){ return Math.min(100, Math.round(state.limitUsed/state.limitTotal*100)); }
function remainingQs(){ return Math.max(0, state.limitTotal - state.limitUsed); }

function renderTop(){
  document.getElementById("hearts").innerHTML = `<span style="font-size:15px">${heartsHTML()}</span>`;
  document.getElementById("stageLabel").textContent =
    state.inBoss ? `보스전 · ${state.bossName} · ${state.bossIdx+1} / ${state.bossTotal}`
    : (state.screen==="game" ? `${state.mode==='review'?"📓 오답 복습":(STAGES[Math.min(state.stage-1,STAGES.length-1)]?.name || "추가 모험")} · ${state.curQIdx+1} / ${(state.stageTarget||state.curStageQs.length||1)}` : "모험을 시작해 볼까?");
  document.getElementById("statgrid").innerHTML = `
    <div class="stat-pill">${state.charEmoji||"🦋"} Lv.${state.level}${evoLabel()}</div>
    <div class="stat-pill">⭐ ${state.xp}/${xpNeeded()}</div>
    <div class="stat-pill">🎮 ${pct()}%</div>`;
  document.getElementById("xpbar").style.width = (state.xp/xpNeeded()*100)+"%";
  document.getElementById("limitbar").style.width = pct()+"%";
  document.getElementById("limittext").textContent =
    `🎮 오늘의 게임 한도 ${pct()}% 사용 · 남은 한도 ${100-pct()}% · 약 ${remainingQs()}문제 더 풀 수 있어요`;
}

function checkAchievements(){
  let newly=[];
  ACHIEVEMENTS.forEach(a=>{
    if(!state.achievements.includes(a.id) && a.check(state)){
      state.achievements.push(a.id); newly.push(a);
    }
  });
  return newly;
}

function addXP(amount){
  state.xp += amount; state.totalXPEarned += amount;
  let leveledUp=false, newEvo=false;
  while(state.xp >= xpNeeded()){
    state.xp -= xpNeeded(); state.level += 1; leveledUp=true;
    if(state.level % 10 === 0){
      state.evolutionStage = Math.floor(state.level/10); newEvo=true;
    }
  }
  return {leveledUp, newEvo};
}

function recordWrong(topic, q, correctText, exp){
  if(!state.wrongBook[topic]) state.wrongBook[topic] = {count:0, examples:[]};
  state.wrongBook[topic].count += 1;
  if(state.wrongBook[topic].examples.length < 3){
    state.wrongBook[topic].examples.push({q, a:correctText, exp});
  }
}
function topicOf(stageIdx){
  return STAGES[stageIdx] ? STAGES[stageIdx].name.split("·")[1].trim() : "종합 문법";
}

/* ========================= 문제 생성 (적응형 난이도) ========================= */
const DIFF_ICON = {easy:"🌱 쉬움", normal:"⚔️ 보통", hard:"🔥 어려움"};

function desiredDifficulty(){
  const r = state.recentResults.slice(-3);
  if(r.length>=2 && r.every(x=>x)) return 'hard';
  if(r.length>=2 && r.filter(x=>!x).length>=2) return 'easy';
  return 'normal';
}
function diffOfIdx(i){ return i<2 ? 'easy' : (i<4 ? 'normal' : 'hard'); }

function pickFixedStageQuestion(stageIdx){
  const pool = STAGES[stageIdx].qs;
  const unasked = pool.map((q,i)=>i).filter(i=>!state.stageAskedIdx.includes(i));
  if(unasked.length===0) return null;
  const desired = desiredDifficulty();
  let candidates = unasked.filter(i=>diffOfIdx(i)===desired);
  if(candidates.length===0) candidates = unasked;
  const pick = candidates[Math.floor(Math.random()*candidates.length)];
  state.stageAskedIdx.push(pick);
  return Object.assign({}, pool[pick], {tag:diffOfIdx(pick)});
}

function genFallbackQuestion(diff){
  diff = diff || 'normal';
  state.fallbackLevel++;
  const subj = POOL_SUBJ[Math.floor(Math.random()*POOL_SUBJ.length)];
  const verb = POOL_VERB[Math.floor(Math.random()*POOL_VERB.length)];
  const obj = POOL_OBJ[Math.floor(Math.random()*POOL_OBJ.length)];
  const isPlural = subj[0]==="I"||subj[0]==="You"||subj[0]==="We"||subj[0]==="They";
  const correctVerb = isPlural ? verb[0] : verb[1];

  if(diff==='easy'){
    const opts4 = shuffle([verb[0], verb[1], verb[0]+"ing", subj[1]+" "+verb[0]]);
    return { q:`${subj[0]} ___ ${obj}.`, opts:opts4, a:opts4.indexOf(correctVerb),
      exp:`${subj[0]}${isPlural?"는 복수 주어라서 동사원형을":"는 3인칭 단수라서 동사에 s를"} 써요.`, tag:'easy' };
  }
  if(diff==='hard'){
    // 부정문 또는 의문문 형태로 난이도를 높인다
    if(Math.random()<0.5){
      const neg = isPlural ? "don't" : "doesn't";
      const opts4 = shuffle([neg, isPlural?"doesn't":"don't", "not", verb[1]+" not"]);
      return { q:`${subj[0]} ___ ${verb[0]} ${obj}.`, opts:opts4, a:opts4.indexOf(neg),
        exp:`${subj[0]}${isPlural?"는 don't":"는 doesn't"}로 부정문을 만들어요.`, tag:'hard' };
    } else {
      const aux = isPlural ? "Do" : "Does";
      const opts4 = shuffle([aux, isPlural?"Does":"Do", "Is", "Am"]);
      return { q:`___ ${subj[0]} ${verb[0]} ${obj}?`, opts:opts4, a:opts4.indexOf(aux),
        exp:`${subj[0]}${isPlural?"는 Do":"는 Does"}로 의문문을 만들어요.`, tag:'hard' };
    }
  }
  // normal
  const opts = [verb[0], verb[1]];
  if(Math.random()>0.5){opts.push(verb[0]+"ing");} else {opts.push(subj[1]+" "+verb[0]);}
  opts.push("not "+verb[0]);
  const shuffled = shuffle([...new Set(opts)].slice(0,4).concat(correctVerb).filter((v,i,a)=>a.indexOf(v)===i));
  while(shuffled.length<4) shuffled.push(verb[0]+"s2");
  const opts4 = shuffled.slice(0,4);
  if(!opts4.includes(correctVerb)) opts4[0]=correctVerb;
  return {
    q:`${subj[0]} ___ ${obj}.`, opts:opts4, a:opts4.indexOf(correctVerb),
    exp:`${subj[0]}${isPlural?"는 복수 주어라서 동사원형을":"는 3인칭 단수라서 동사에 s를"} 써요.`, tag:'normal'
  };
}
function shuffle(arr){ return arr.map(v=>[Math.random(),v]).sort((a,b)=>a[0]-b[0]).map(v=>v[1]); }

function appendNextStageQuestion(){
  const idx = state.stage-1;
  let q = STAGES[idx] ? pickFixedStageQuestion(idx) : null;
  if(!q) q = genFallbackQuestion(desiredDifficulty());
  state.curStageQs.push(q);
}
function loadStageQuestions(){
  state.mode = 'stage';
  state.curStageQs = []; state.curQIdx = 0; state.answered=false; state.lastPick=-1;
  state.stageAskedIdx = [];
  const idx = state.stage-1;
  state.stageTarget = STAGES[idx] ? Math.min(6, STAGES[idx].qs.length) : 6;
  appendNextStageQuestion();
}

function pickAnswer(i){
  if(state.answered) return;
  const q = state.inBoss ? state.curBossQ : state.curStageQs[state.curQIdx];
  state.answered = true; state.lastPick = i;
  const correct = i === q.a;
  const btns = document.querySelectorAll("#opts .btn");
  btns.forEach((b,idx)=>{
    b.classList.add("disabled");
    if(idx===q.a) b.classList.add("correct");
    else if(idx===i) b.classList.add("wrong");
  });
  const fb = document.getElementById("feedback");
  state.totalAnswered++;
  checkLimitReset(state); state.limitUsed++;
  if(state.mode==='stage' && !state.inBoss){
    state.recentResults.push(correct);
    if(state.recentResults.length>5) state.recentResults.shift();
  }

  if(correct){
    state.totalCorrect++; state.streak++; state.bestStreak=Math.max(state.bestStreak,state.streak);
    const {leveledUp, newEvo} = addXP(20);
    fb.className="ok";
    fb.innerHTML = `🎉 정답! +20 XP` + (leveledUp?`<br>✨ 레벨업! Lv.${state.level}`:"") + (newEvo?`<br>🌟 캐릭터가 진화했어요!`:"");
    if(state.inBoss){ state.bossCorrect++; state.bossHP = Math.max(0, state.bossHP-20); }
  } else {
    state.totalWrong++; state.streak=0;
    fb.className="bad";
    fb.innerHTML = `🙂 아쉽지만 괜찮아!<br>정답: <b>${q.opts[q.a]}</b><br>${q.exp}`;
    const topic = state.inBoss ? state.bossName : topicOf(state.stage-1);
    recordWrong(topic, q.q, q.opts[q.a], q.exp);
  }
  const newAch = checkAchievements();
  if(newAch.length){
    fb.innerHTML += `<br>🏆 새 업적: ${newAch.map(a=>a.name).join(", ")}`;
  }
  save();
  renderTop();
  renderActionBar();
}

function nextQuestion(){
  if(state.inBoss){ return nextBossQuestion(); }
  state.curQIdx++;
  if(state.curQIdx >= state.stageTarget){
    if(state.mode==='review'){
      state.mode='stage'; state.reviewCleared=true;
      checkAchievements();
      state.screen='reviewDone';
      save(); renderAll(); return;
    }
    // 스테이지 완료
    const bossInfo = BOSSES[state.stage];
    if(bossInfo){ startBoss(bossInfo); return; }
    state.stage++;
    loadStageQuestions();
  } else {
    if(state.curStageQs.length <= state.curQIdx) appendNextStageQuestion();
    state.answered=false; state.lastPick=-1;
  }
  save(); renderAll();
}

/* ---- 보스전 ---- */
function startBoss(info){
  state.inBoss = true; state.bossHP=100; state.bossIdx=0; state.bossCorrect=0;
  state.bossTotal = info.n; state.bossName = info.name; state.bossFailed=false;
  const pool = STAGES.flatMap(s=>s.qs);
  state.bossQs = Array.from({length:info.n}, (_,i)=> pool[Math.floor(Math.random()*pool.length)] || genFallbackQuestion('normal'));
  state.curBossQ = state.bossQs[0];
  state.answered=false; state.lastPick=-1;
  save(); renderAll();
}
function nextBossQuestion(){
  state.bossIdx++;
  if(state.bossIdx >= state.bossTotal){
    const need = Math.ceil(state.bossTotal*2/3);
    if(state.bossCorrect >= need){
      state.inBoss=false; state.bossClears.push(state.bossName);
      state.stage++;
      checkAchievements();
      loadStageQuestions();
      state.screen="bossResult"; state.bossResultWin=true;
    } else {
      state.bossFailed=true;
      state.screen="bossResult"; state.bossResultWin=false;
    }
  } else {
    state.curBossQ = state.bossQs[state.bossIdx];
    state.answered=false; state.lastPick=-1;
  }
  save(); renderAll();
}

      <button class="btn btn-primary" id="backToGameBtn">▶️ 모험으로 돌아가기</button>
    </div>`;
  document.getElementById("backToGameBtn").onclick=()=>{
    state.screen="game";
    if(!state.curStageQs || state.mode!=='stage' || state.curQIdx>=state.stageTarget) loadStageQuestions();
    save(); renderAll();
  };
  renderTop();
}

/* ---- 캐릭터 ---- */
function renderChar(){
  document.getElementById("actionbar").className="hidden";
  const main = document.getElementById("main");
  main.innerHTML = `
    <h2 class="section-title">캐릭터</h2>
    <div class="center-card">
      <div class="big-emoji">${state.charEmoji}</div>
      <p style="font-size:18px;font-weight:700">${state.charName || "이름 없는 모험가"}${evoLabel()}</p>
      <p>Lv.${state.level} · 진화 단계 ${state.evolutionStage}</p>
      <p style="font-size:13px;color:#7a6d99">다음 진화까지 Lv.${(Math.floor(state.level/10)+1)*10}</p>
    </div>
    ${backBtn()}`;
  wireBack(); renderTop();
}

/* ---- 업적 ---- */
function renderAch(){
  document.getElementById("actionbar").className="hidden";
  const main = document.getElementById("main");
  const got = ACHIEVEMENTS.filter(a=>state.achievements.includes(a.id));
  const next = ACHIEVEMENTS.find(a=>!state.achievements.includes(a.id));
  let html = `<h2 class="section-title">🏆 업적 (${got.length} / ${ACHIEVEMENTS.length})</h2><div class="badge-row">`;
  ACHIEVEMENTS.forEach(a=>{
    const has = state.achievements.includes(a.id);
    html += `<div class="badge ${has?"":"locked"}"><div class="ic">${a.ic}</div>${a.name}</div>`;
  });
  html += `</div>`;
  if(next){ html += `<div class="note-card"><h4>다음 목표</h4><p>${next.ic} ${next.name}</p></div>`; }
  html += backBtn();
  main.innerHTML = html; wireBack(); renderTop();
}

/* ---- 보스 정보 ---- */
function renderBossInfo(){
  document.getElementById("actionbar").className="hidden";
  const main = document.getElementById("main");
  let html = `<h2 class="section-title">👹 보스</h2>`;
  Object.entries(BOSSES).forEach(([stageNum, b])=>{
    const cleared = state.bossClears.includes(b.name);
    html += `<div class="note-card"><h4>${b.name}</h4><p>등장 위치: Stage ${stageNum}</p>
      <p>문제 수: ${b.n} · 클리어 조건: ${Math.ceil(b.n*2/3)}문제 이상 정답</p>
      <p>${cleared?"✅ 클리어 완료!":"⏳ 아직 도전하지 않았어요."}</p></div>`;
  });
  html += backBtn();
  main.innerHTML = html; wireBack(); renderTop();
}

/* ---- 상태 ---- */
function renderStatus(){
  document.getElementById("actionbar").className="hidden";
  const main = document.getElementById("main");
  const rows = [
    ["캐릭터", `${state.charEmoji} ${state.charName||""}`],
    ["학년", `${state.playerGrade||"미입력"}${state.playerAge?" · "+state.playerAge+"세":""}`],
    ["레벨", `Lv.${state.level}`],
    ["XP", `${state.xp} / ${xpNeeded()}`],
    ["하트", heartsHTML()],
    ["게임 한도", `${pct()}%`],
    ["현재 Stage", `${state.stage}`],
    ["누적 문제 수", `${state.totalAnswered}`],
    ["누적 정답", `${state.totalCorrect}`],
    ["누적 오답", `${state.totalWrong}`],
    ["보스 클리어 수", `${state.bossClears.length}`],
    ["업적 수", `${state.achievements.length} / ${ACHIEVEMENTS.length}`],
  ];
  let html = `<h2 class="section-title">📊 상태</h2>`;
  rows.forEach(([k,v])=>{ html += `<div class="stat-line"><span>${k}</span><span>${v}</span></div>`; });
  html += backBtn();
  main.innerHTML = html; wireBack(); renderTop();
}

/* ========================= 라우터 ========================= */
function limitBanner(){
  const p = pct();
  const milestones = [50,75,80,90,95,96,97,98,99];
  if(milestones.includes(p) && state._lastBanner !== p){
    state._lastBanner = p;
  }
}
function renderAll(){
  save();
  switch(state.screen){
    case "playerInfo": renderPlayerInfo(); break;
    case "levelTest": renderLevelTest(); break;
    case "levelResult": renderLevelResult(); break;
    case "tutorial": renderTutorial(); break;
    case "start": renderStart(); break;
    case "menu": renderMenu(); break;
    case "note": renderNote(); break;
    case "char": renderChar(); break;
    case "ach": renderAch(); break;
    case "bossinfo": renderBossInfo(); break;
    case "status": renderStatus(); break;
    case "bossResult": renderBossResult(); break;
    case "reviewDone": renderReviewDone(); break;
    case "game":
    default:
      if(!state.curStageQs || state.curStageQs.length===0) loadStageQuestions();
      renderQuestion();
  }
}

/* 초기 진입 */
if(state.onboardingDone && (state.screen==="playerInfo" || state.screen==="start")){
  state.screen = "game";
}
if(!state.onboardingDone && !["playerInfo","levelTest","levelResult","start","tutorial"].includes(state.screen)){
  state.screen = "playerInfo";
}
if(state.screen==="game" && (!state.curStageQs||state.curStageQs.length===0)) loadStageQuestions();
renderAll();
</script>
</body>
</html>
